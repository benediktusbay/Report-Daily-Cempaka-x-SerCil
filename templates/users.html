{% extends 'base.html' %}{% block body %}<div class="row g-4"><div class="col-lg-5"><div class="card p-4"><h4 class="section-title">Add Team User</h4><form method="post"><label class="form-label">Username</label><input class="form-control mb-3" name="username" required><label class="form-label">Password</label><input class="form-control mb-3" name="password" type="password" required><label class="form-label">Role</label><select class="form-select mb-4" name="role"><option value="viewer">Viewer</option><option value="admin">Admin</option></select><button class="btn btn-primary">Create User</button></form></div></div><div class="col-lg-7"><div class="card p-4"><h4 class="section-title">Existing Users</h4><table class="table"><thead><tr><th>Username</th><th>Role</th></tr></thead><tbody>{% for u in users %}<tr><td>{{u.username}}</td><td><span class="badge text-bg-secondary">{{u.role}}</span></td></tr>{% endfor %}</tbody></table></div></div></div>{% endblock %}
