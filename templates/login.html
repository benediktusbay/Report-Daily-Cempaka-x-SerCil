<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{min-height:100vh;background:linear-gradient(135deg,#0d1b2a,#1d4ed8);display:grid;place-items:center}.card{border:0;border-radius:20px;box-shadow:0 20px 50px #0004}</style></head><body><div class="card p-4" style="width:min(420px,92vw)"><h3 class="fw-bold">Daily Sales Report</h3><p class="text-secondary">Login untuk mengakses dashboard tim.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="alert alert-{{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><label class="form-label">Username</label><input class="form-control mb-3" name="username" required><label class="form-label">Password</label><input class="form-control mb-4" name="password" type="password" required><button class="btn btn-primary w-100">Login</button></form></div></body></html>
