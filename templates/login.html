{% extends "base.html" %}

{% block title %}Login | Daily Sales Report{% endblock %}

{% block head %}
<style>
  .login-wrap {
    min-height: calc(100vh - 150px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .login-card {
    width: min(420px, 100%);
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 8px 28px rgba(15,23,42,.08);
  }

  .login-card h1 {
    margin: 0 0 6px;
    font-size: 26px;
  }

  .login-card p {
    margin: 0 0 22px;
    color: #6b7280;
    font-size: 13px;
  }

  .field {
    margin-bottom: 15px;
  }

  .field label {
    display: block;
    margin-bottom: 6px;
    font-size: 12px;
    color: #6b7280;
    font-weight: 700;
  }

  .field input {
    width: 100%;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    padding: 11px 12px;
    background: white;
  }

  .btn {
    width: 100%;
    border: 0;
    background: #0b2545;
    color: white;
    padding: 11px 14px;
    border-radius: 9px;
    font-weight: 800;
    cursor: pointer;
  }

  .btn:hover {
    background: #133c65;
  }
</style>
{% endblock %}

{% block body %}

<div class="login-wrap">

  <div class="login-card">

    <h1>Login</h1>

    <p>
      Daily Sales Report — Cempaka × SerCil
    </p>

    <form method="post"
          action="{{ url_for('login') }}">

      <div class="field">

        <label>Username</label>

        <input type="text"
               name="username"
               autocomplete="username"
               required>

      </div>

      <div class="field">

        <label>Password</label>

        <input type="password"
               name="password"
               autocomplete="current-password"
               required>

      </div>

      <button class="btn"
              type="submit">
        Login
      </button>

    </form>

  </div>

</div>

{% endblock %}
